<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felipe - About</title>
  </head>
  <body>

    <h1>Hello, I'm Felipe</h1>
    <h2>I am from Chile. This is my flag</h2>

    <!-- img = image. It has NO closing tag (nothing goes "inside" an image).
         src = where the image file is. "images/photo.jpg" means:
               go into the "images" folder, next to this file, and find photo.jpg.
         alt = text description, shown if the image fails to load and read
               aloud by screen readers. Always write one.
         width = size in pixels (we'll do this properly with CSS later). -->
    <img src="images/chile-flag.webp" alt="Chile Flag" width="400">


    <!-- A link to ANOTHER PAGE OF YOUR OWN SITE.
         No "https://" needed: "about.html" means "the file about.html
         in this same folder". This is called a RELATIVE path. -->
    <p><a href="index.html">Go to the home page</a></p>

  </body>
</html>
