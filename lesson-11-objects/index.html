<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 11 - Objects</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <h1>Lesson 11 - Objects</h1>

      <h2>Store</h2>
      <!-- Empty on purpose: JavaScript builds one card per product -->
      <div id="store" class="cards"></div>

      <h2>Inventory</h2>
      <p id="inventory-value"></p>
      <p id="cheapest"></p>

      <h2>Add a product</h2>
      <input id="name-input" type="text" placeholder="Name">
      <input id="price-input" type="number" placeholder="Price">
      <input id="stock-input" type="number" placeholder="Stock">
      <button id="add-button">Add</button>
      <p id="form-message" class="warning"></p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
