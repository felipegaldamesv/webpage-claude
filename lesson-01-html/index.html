<!DOCTYPE html>
<!-- Line above: tells the browser "this is a modern HTML document". -->

<!-- Everything lives inside <html>. lang="en" says the page is in English. -->
<html lang="en">

<!-- <head>: information ABOUT the page. Not shown on screen. -->

<head>
  <!-- Lets the page show accents and ñ correctly. -->
  <meta charset="UTF-8">
  <!-- Text shown on the browser tab. -->
  <title>My First Page</title>
</head>

<!-- <body>: everything you SEE on the page. -->

<body>

  <!-- h1 = the biggest heading. There are h1 to h6. -->
  <h1>Hello, I'm Felipe</h1>
  <h2>My hobbies</h2>
  <ul>
    <li>Golf</li>
    <li>Soccer</li>
    <li>Play Games</li>
  </ul>

  <ol>
    <li>Golf</li>
    <li>Soccer</li>
    <li>Play Games</li>
  </ol>
  <!-- p = paragraph. -->
  <p>This is my first web page. I'm learning HTML.</p>

  <!-- a = link. href is the address it goes to. -->
  <p>Here is a link to <a href="https://www.google.com">Google</a>.</p>

</body>

</html>
