<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 9 - Conditionals</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <h1>Lesson 9 - Conditionals</h1>

      <h2>Smart counter</h2>
      <p>Clicks: <span id="counter">0</span></p>
      <button id="minus-button">-1</button>
      <button id="add-button">+1</button>
      <button id="reset-button">Reset</button>

      <!-- JavaScript will write messages here -->
      <p id="message"></p>

      <h2>Age checker</h2>
      <!-- input = a box where the user types. type="number" only allows numbers. -->
      <input id="age-input" type="number" placeholder="Your age">
      <button id="check-button">Check</button>
      <p id="age-message"></p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
