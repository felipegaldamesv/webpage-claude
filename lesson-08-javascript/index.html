<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 8 - JavaScript</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <h1>Lesson 8 - JavaScript</h1>

      <!-- id = a UNIQUE name for ONE element (a class can be shared, an id cannot).
           JavaScript uses ids to find exactly the element it wants to change. -->
      <p id="greeting">Hello! Click the button.</p>
      <button id="greet-button">Say hi</button>

      <h2>Counter</h2>
      <p>Clicks: <span id="counter">0</span></p>
      <button id="add-button">+1</button>
      <!-- EXERCISE: add a "Reset" button here with id="reset-button" -->
    </main>

    <!-- script = connects this page to a JavaScript file.
         It goes at the END of <body>, so the HTML above exists before the code runs. -->
    <script src="script.js"></script>
  </body>
</html>
