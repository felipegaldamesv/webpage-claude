  <head>

    <title>Lesson 6 - About</title>
    <!-- link = connects this page to a CSS file.
         rel="stylesheet" says what kind of file it is; href says where it is. -->
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <!-- SEMANTIC TAGS: they work like <div>, but their NAME says what they are.
         Google and screen readers use them to understand the page.
         <header> = top of the page, <nav> = navigation menu,
         <main> = the main content, <footer> = bottom of the page. -->
    <header>
      <nav>
        <a href="index.html" class="logo">Felipe</a>
        <ul class="menu">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
        </ul>
      </nav>
    </header>

    <main>

    <h1>Hello, I'm Felipe</h1>
    <h2>I am from Chile. This is my flag</h2>
    <img src="images/chile-flag.webp" alt="Chile Flag">
    <p><a href="index.html">Go to the home page</a></p>

    </main>

    <footer>
      <p>&copy; 2026 Felipe</p>  <!-- &copy; is an "HTML entity": it shows the © symbol -->
    </footer>

  </body>
</html>
